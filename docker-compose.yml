# Self-hosted LiveKit for local development (Phase 4 video).
# For production self-hosting, follow LiveKit's deployment guide (TLS + TURN);
# or use LiveKit Cloud and skip this file entirely.
#
#   docker compose up livekit
#   LIVEKIT_URL=ws://localhost:7880  LIVEKIT_API_KEY=devkey  LIVEKIT_API_SECRET=secret
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
